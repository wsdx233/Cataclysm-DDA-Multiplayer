name: Multiplayer vanilla build baseline

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform package target; keep all for Tier 3 milestones
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - android
  # Keep both event path lists and jobs.changes in sync when adding or
  # renaming a platform-owned or cross-platform public-boundary path.
  push:
    branches:
      - multiplayer/main
    paths:
      - '.github/actions/build-sdl3-shaders/**'
      - '.github/vcpkg_triplets/**'
      - '.github/workflows/multiplayer-baseline.yml'
      - 'android/**'
      - 'build-scripts/**'
      - 'data/**'
      - 'gfx/**'
      - 'lang/**'
      - 'msvc-full-features/**'
      - 'src/*font*'
      - 'src/*imgui*'
      - 'src/*sound*'
      - 'src/*tileset*'
      - 'src/cata_tiles.*'
      - 'src/cata_allocator.*'
      - 'src/filesystem.*'
      - 'src/get_version.h'
      - 'src/mingw.thread.h'
      - 'src/mmap_file.*'
      - 'src/multiplayer_client_ui.*'
      - 'src/multiplayer_crypto.h'
      - 'src/multiplayer_protocol.*'
      - 'src/multiplayer_transport.h'
      - 'src/path_info.*'
      - 'src/platform_win.h'
      - 'src/resource.rc'
      - 'src/sdl*'
      - 'src/third-party/CMakeLists.txt'
      - 'src/third-party/imgui/**'
      - 'src/third-party/snmalloc/pal/pal_windows.h'
      - 'src/version.cpp'
      - 'src/wincurse.cpp'
      - 'src/system_locale.*'
      - 'tools/format/**'
      - 'tools/gfx_tools/**'
      - 'Makefile'
      - 'src/third-party/multiplayer_protocol_generated.h'
      - 'tools/multiplayer/protocol/multiplayer_protocol.fbs'
  pull_request:
    branches:
      - multiplayer/main
    paths:
      - '.github/actions/build-sdl3-shaders/**'
      - '.github/vcpkg_triplets/**'
      - '.github/workflows/multiplayer-baseline.yml'
      - 'android/**'
      - 'build-scripts/**'
      - 'data/**'
      - 'gfx/**'
      - 'lang/**'
      - 'msvc-full-features/**'
      - 'src/*font*'
      - 'src/*imgui*'
      - 'src/*sound*'
      - 'src/*tileset*'
      - 'src/cata_tiles.*'
      - 'src/cata_allocator.*'
      - 'src/filesystem.*'
      - 'src/get_version.h'
      - 'src/mingw.thread.h'
      - 'src/mmap_file.*'
      - 'src/multiplayer_client_ui.*'
      - 'src/multiplayer_crypto.h'
      - 'src/multiplayer_protocol.*'
      - 'src/multiplayer_transport.h'
      - 'src/path_info.*'
      - 'src/platform_win.h'
      - 'src/resource.rc'
      - 'src/sdl*'
      - 'src/third-party/CMakeLists.txt'
      - 'src/third-party/imgui/**'
      - 'src/third-party/snmalloc/pal/pal_windows.h'
      - 'src/version.cpp'
      - 'src/wincurse.cpp'
      - 'src/system_locale.*'
      - 'tools/format/**'
      - 'tools/gfx_tools/**'
      - 'Makefile'
      - 'src/third-party/multiplayer_protocol_generated.h'
      - 'tools/multiplayer/protocol/multiplayer_protocol.fbs'

concurrency:
  group: multiplayer-baseline-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASELINE_UPSTREAM_COMMIT: d84b90dd2aee090ca28c8dad5cdf1fab6dea151a
  BASELINE_TILESET_COMMIT: 13b1e25e4362af9e90885b323296ec8226ccae47
  BASELINE_SOUNDPACK_COMMIT: 88586bb600eae4b053a8928bddbd5371d0b1ecc6
  BASELINE_VCPKG_COMMIT: f6672d8e480ccdecddfad3fd1b838ba369ffe6cd
  BASELINE_TRANSLATIONS_SHA256: 999419a0c0da8ec25f92dd85127fe858145ff5b59e5582ad5094ad8a98c735ab
  ZSTD_CLEVEL: 17

jobs:
  changes:
    name: Select affected platform packages
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.scope.outputs.android }}
      linux: ${{ steps.scope.outputs.linux }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - name: Checkout source and event history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select package targets
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail

          linux=false
          windows=false
          android=false
          classify_paths=false

          select_all() {
            linux=true
            windows=true
            android=true
          }

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "Manual run target: $MANUAL_TARGET"
            case "$MANUAL_TARGET" in
              all)
                select_all
                ;;
              linux)
                linux=true
                ;;
              windows)
                windows=true
                ;;
              android)
                android=true
                ;;
              *)
                echo "Unsupported manual target: $MANUAL_TARGET" >&2
                exit 1
                ;;
            esac
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Unable to resolve the event base commit; rerun with an explicit manual target." >&2
            exit 1
          else
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "Fetching the event base commit $BASE_SHA."
              git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            fi
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              classify_paths=true
            else
              echo "Unable to fetch the event base commit; rerun with an explicit manual target." >&2
              exit 1
            fi
          fi

          if [[ "$classify_paths" == true ]]; then
            echo "Changed paths from $BASE_SHA to $GITHUB_SHA:"
            changed_paths="$RUNNER_TEMP/multiplayer-baseline-changed-paths"
            if ! git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$changed_paths"; then
              echo "Unable to calculate changed paths; rerun with an explicit manual target." >&2
              exit 1
            else
              while IFS= read -r -d '' path; do
                echo "  $path"
                case "$path" in
                  .github/workflows/multiplayer-baseline.yml)
                    select_all
                    ;;
                  Makefile)
                    linux=true
                    ;;
                  build-scripts/*.ps1|build-scripts/MSVC.cmake|build-scripts/*windows*|build-scripts/*mingw*)
                    windows=true
                    ;;
                  build-scripts/activate-multiplayer-build-env.sh|build-scripts/check-multiplayer-build-env.sh)
                    linux=true
                    android=true
                    ;;
                  build-scripts/bundle-sdl3-linux.sh)
                    linux=true
                    ;;
                  build-scripts/*)
                    select_all
                    ;;
                  data/*|lang/*|src/get_version.h|src/version.cpp)
                    select_all
                    ;;
                  src/filesystem.*|src/mmap_file.*|src/path_info.*|src/system_locale.*)
                    select_all
                    ;;
                  .github/actions/build-sdl3-shaders/*|gfx/*|tools/format/*|tools/gfx_tools/*)
                    windows=true
                    android=true
                    ;;
                  src/cata_allocator.*|src/multiplayer_client_ui.*|src/multiplayer_crypto.h|src/multiplayer_transport.h)
                    windows=true
                    android=true
                    ;;
                  src/multiplayer_protocol.*|src/third-party/multiplayer_protocol_generated.h|tools/multiplayer/protocol/multiplayer_protocol.fbs)
                    windows=true
                    android=true
                    ;;
                  src/sdl*|src/cata_tiles.*|src/*font*|src/*imgui*|src/*sound*|src/*tileset*)
                    windows=true
                    android=true
                    ;;
                  .github/vcpkg_triplets/*|msvc-full-features/*|src/mingw.thread.h|src/platform_win.h|src/resource.rc|src/third-party/snmalloc/pal/pal_windows.h|src/wincurse.cpp)
                    windows=true
                    ;;
                  android/*|src/third-party/CMakeLists.txt)
                    android=true
                    ;;
                esac
              done < "$changed_paths"
            fi
          fi

          if [[ "$linux" == false && "$windows" == false && "$android" == false ]]; then
            echo "The workflow was triggered, but no package target matched; failing closed." >&2
            exit 1
          fi

          {
            echo "linux=$linux"
            echo "windows=$windows"
            echo "android=$android"
          } | tee -a "$GITHUB_OUTPUT"

  translations:
    name: Extract pinned release translations
    needs:
      - changes
    if: ${{ needs.changes.outputs.linux == 'true' || needs.changes.outputs.windows == 'true' || needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify baseline release package
        run: |
          package="$RUNNER_TEMP/cdda-linux-terminal-only-x64-2026-07-11-0744.tar.gz"
          curl -fL --retry 3 \
            https://github.com/CleverRaven/Cataclysm-DDA/releases/download/cdda-experimental-2026-07-11-0744/cdda-linux-terminal-only-x64-2026-07-11-0744.tar.gz \
            -o "$package"
          printf '%s  %s\n' "$BASELINE_TRANSLATIONS_SHA256" "$package" | sha256sum -c -
          mkdir -p translations
          tar -xzf "$package" \
            --wildcards \
            --strip-components=1 \
            -C translations \
            '*/lang/mo/*'
          test -f translations/lang/mo/zh_CN/LC_MESSAGES/cataclysm-dda.mo
          test -f translations/lang/mo/zh_TW/LC_MESSAGES/cataclysm-dda.mo

      - name: Upload compiled translations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-baseline-translations
          path: translations
          if-no-files-found: error
          retention-days: 7

  default-tileset:
    name: Compose default tileset
    needs:
      - changes
    if: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install composition dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips42 python3-venv
          python3 -m venv "$RUNNER_TEMP/tileset-venv"
          "$RUNNER_TEMP/tileset-venv/bin/pip" install pyvips==2.2.3
          echo "$RUNNER_TEMP/tileset-venv/bin" >> "$GITHUB_PATH"

      - name: Build JSON formatter
        run: make -j2 tools/format/json_formatter.cgi

      - name: Fetch pinned tileset source
        run: |
          tileset_source="$RUNNER_TEMP/CDDA-Tilesets"
          git init "$tileset_source"
          git -C "$tileset_source" remote add origin https://github.com/I-am-Erk/CDDA-Tilesets.git
          git -C "$tileset_source" sparse-checkout init --cone
          git -C "$tileset_source" sparse-checkout set gfx/UltimateCataclysm
          git -C "$tileset_source" fetch --depth 1 origin "$BASELINE_TILESET_COMMIT"
          git -C "$tileset_source" checkout --detach FETCH_HEAD

      - name: Compose UltimateCataclysm
        run: |
          source_dir="$RUNNER_TEMP/CDDA-Tilesets/gfx/UltimateCataclysm"
          destination_dir="$GITHUB_WORKSPACE/gfx/UltimateCataclysm"
          rm -rf "$destination_dir"
          python3 tools/gfx_tools/compose.py \
            --use-all \
            --obsolete-fillers \
            --feedback CONCISE \
            --format-json \
            --loglevel INFO \
            "$source_dir" "$destination_dir"
          cp "$source_dir/tileset.txt" "$destination_dir/"
          if [ -f "$source_dir/fallback.png" ]; then
            cp "$source_dir/fallback.png" "$destination_dir/"
          fi
          if [ -f "$source_dir/layering.json" ]; then
            cp "$source_dir/layering.json" "$destination_dir/"
          fi

      - name: Upload default tileset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-baseline-default-tileset
          path: gfx/UltimateCataclysm
          if-no-files-found: error
          retention-days: 7

  soundpack:
    name: Fetch pinned soundpack
    needs:
      - changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch CC-Sounds
        run: |
          soundpack_source="$RUNNER_TEMP/CDDA-Soundpacks"
          git init "$soundpack_source"
          git -C "$soundpack_source" remote add origin https://github.com/Fris0uman/CDDA-Soundpacks.git
          git -C "$soundpack_source" fetch --depth 1 origin "$BASELINE_SOUNDPACK_COMMIT"
          git -C "$soundpack_source" checkout --detach FETCH_HEAD
          git -C "$soundpack_source" submodule update --init --recursive --depth 1
          mkdir -p data
          cp -a "$soundpack_source/sound/CC-Sounds" data/sound

      - name: Upload soundpack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-baseline-soundpack
          path: data/sound
          if-no-files-found: error
          retention-days: 7

  shaders:
    name: Compile SDL3 shaders
    needs:
      - changes
    if: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build shader artifacts
        uses: ./.github/actions/build-sdl3-shaders
        with:
          artifact-name: multiplayer-baseline-shaders
          retention-days: '7'

  linux-curses:
    name: Linux x64 curses package
    runs-on: ubuntu-24.04
    needs:
      - changes
      - translations
    if: ${{ needs.changes.outputs.linux == 'true' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download compiled translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: multiplayer-baseline-translations
          path: ${{ runner.temp }}/baseline-translations

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ccache gettext libncursesw5-dev parallel

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: multiplayer-baseline-linux-curses-${{ github.sha }}
          restore-keys: |
            multiplayer-baseline-linux-curses-

      - name: Build pinned libbacktrace
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git "$RUNNER_TEMP/libbacktrace"
          git -C "$RUNNER_TEMP/libbacktrace" checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          cd "$RUNNER_TEMP/libbacktrace"
          ./configure
          make -j"$(nproc)"
          cp LICENSE "$GITHUB_WORKSPACE/LICENSE-libbacktrace.txt"
          sudo make install

      - name: Create build identity
        run: |
          cat > VERSION.txt <<EOF
          build type: multiplayer-baseline-linux-curses-x64
          source commit: $GITHUB_SHA
          upstream baseline: $BASELINE_UPSTREAM_COMMIT
          EOF

      - name: Build package
        run: |
          make COMPILER=clang++-18 \
            -j"$(nproc)" \
            MULTIPLAYER_BUILD_ID="$GITHUB_SHA" \
            TILES=0 \
            SOUND=0 \
            RELEASE=1 \
            LOCALIZE=1 \
            LANGUAGES=all \
            BACKTRACE=1 \
            LIBBACKTRACE=1 \
            WARN_STALE_DATA=1 \
            PCH=0 \
            CCACHE=1 \
            bindist

      - name: Smoke test and record provenance
        run: |
          mkdir -p artifacts smoke
          package="$(find . -maxdepth 1 -type f -name 'cataclysmdda-*.tar.gz' -print -quit)"
          test -n "$package"
          repack_dir="$(mktemp -d)"
          tar -xzf "$package" -C "$repack_dir"
          package_root="$(find "$repack_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$package_root"
          rm -rf "$package_root/lang/mo"
          mkdir -p "$package_root/lang"
          cp -a "$RUNNER_TEMP/baseline-translations/lang/mo" "$package_root/lang/mo"
          test -f "$package_root/lang/mo/zh_CN/LC_MESSAGES/cataclysm-dda.mo"
          tar -czf "$package" -C "$repack_dir" "$(basename "$package_root")"
          cp "$package" artifacts/cdda-linux-curses-x64-baseline.tar.gz
          tar -xzf artifacts/cdda-linux-curses-x64-baseline.tar.gz -C smoke
          binary="$(find smoke -type f -name cataclysm -perm -111 -print -quit)"
          test -n "$binary"
          "$binary" --version | tee artifacts/linux-version.txt
          grep -Fx "multiplayer build id: $GITHUB_SHA" artifacts/linux-version.txt
          {
            echo "artifact=cdda-linux-curses-x64-baseline.tar.gz"
            echo "sha256=$(sha256sum artifacts/cdda-linux-curses-x64-baseline.tar.gz | cut -d' ' -f1)"
            echo "source_commit=$GITHUB_SHA"
            echo "multiplayer_build_id=$GITHUB_SHA"
            echo "upstream_baseline=$BASELINE_UPSTREAM_COMMIT"
            echo "runner_image=ubuntu-24.04"
            echo "compiler=$(clang++-18 --version | head -n 1)"
            echo "translations_sha256=$BASELINE_TRANSLATIONS_SHA256"
            echo "build_command=make TILES=0 SOUND=0 RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 LIBBACKTRACE=1 PCH=0 bindist"
          } > artifacts/linux-build-manifest.txt

      - name: Upload Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-baseline-linux-curses-x64-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-client:
    name: Windows x64 MSVC tiles and sound package
    runs-on: windows-2022
    needs:
      - changes
      - default-tileset
      - soundpack
      - shaders
      - translations
    if: ${{ needs.changes.outputs.windows == 'true' }}
    env:
      BACKTRACE: 1
      CDDA_RELEASE_BUILD: 1
      MULTIPLAYER_BUILD_ID: ${{ github.sha }}
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download default tileset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: multiplayer-baseline-default-tileset
          path: gfx/UltimateCataclysm

      - name: Download soundpack
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: multiplayer-baseline-soundpack
          path: data/sound

      - name: Download shader artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: multiplayer-baseline-shaders
          path: data/shaders

      - name: Download compiled translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: multiplayer-baseline-translations
          path: .

      - name: Setup MSYS2
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make

      - name: Mark shader artifacts fresh
        shell: msys2 {0}
        run: touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Install CMake 3
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375
        with:
          cmakeVersion: 3.31.6

      - name: Install pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/../b/vcpkg'
          vcpkgGitCommitId: ${{ env.BASELINE_VCPKG_COMMIT }}

      - name: Integrate vcpkg
        run: vcpkg integrate install --vcpkg-root "${{ github.workspace }}\..\b\vcpkg"

      - name: Cache installed vcpkg packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msvc-full-features/vcpkg_installed
          key: multiplayer-baseline-vcpkg-${{ hashFiles('msvc-full-features/vcpkg.json', '.github/vcpkg_triplets/x64-windows-static.cmake') }}-${{ env.BASELINE_VCPKG_COMMIT }}

      - name: Compile translations
        shell: msys2 {0}
        run: lang/compile_mo.sh all

      - name: Create build identity
        shell: pwsh
        run: |
          @(
            'build type: multiplayer-baseline-windows-client-x64'
            'source commit: ${{ github.sha }}'
            'upstream baseline: ${{ env.BASELINE_UPSTREAM_COMMIT }}'
          ) | Set-Content -Encoding ascii VERSION.txt

      - name: Build package
        shell: pwsh
        run: |
          & .\msvc-full-features\prebuild.cmd
          if ($LASTEXITCODE -ne 0) {
            throw "MSVC prebuild failed with exit code $LASTEXITCODE"
          }
          msbuild -m -p:Configuration=Release -p:Platform=x64 "-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip" msvc-full-features\Cataclysm-vcpkg-static.sln
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }
          .\build-scripts\windist.ps1 -SDL3

      - name: Smoke test and record provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item cataclysmdda-0.J.zip artifacts\cdda-windows-client-x64-baseline.zip
          $versionStdout = Join-Path $env:RUNNER_TEMP 'cdda-windows-version.stdout.txt'
          $versionStderr = Join-Path $env:RUNNER_TEMP 'cdda-windows-version.stderr.txt'
          $versionProcess = Start-Process `
            -FilePath (Resolve-Path .\bindist\cataclysm-tiles.exe).Path `
            -ArgumentList '--version' `
            -RedirectStandardOutput $versionStdout `
            -RedirectStandardError $versionStderr `
            -Wait `
            -PassThru
          $versionOutput = @(
            if (Test-Path $versionStdout) { Get-Content $versionStdout }
            if (Test-Path $versionStderr) { Get-Content $versionStderr }
          )
          $versionText = ($versionOutput -join [Environment]::NewLine).Trim()
          if ($versionProcess.ExitCode -ne 0) {
            throw "Windows version smoke test failed with exit code $($versionProcess.ExitCode): $versionText"
          }
          $versionLines = @($versionOutput | ForEach-Object { $_.Trim() })
          if ([string]::IsNullOrWhiteSpace($versionText) -or
              $versionText -notmatch 'Cataclysm' -or
              $versionLines -notcontains '+tiles, +sound' -or
              $versionLines -cnotcontains 'multiplayer build id: ${{ github.sha }}') {
            throw "Windows version smoke test produced unexpected output: $versionText"
          }
          $versionText | Set-Content artifacts\windows-version.txt
          $helpStdout = Join-Path $env:RUNNER_TEMP 'cdda-windows-help.stdout.txt'
          $helpStderr = Join-Path $env:RUNNER_TEMP 'cdda-windows-help.stderr.txt'
          $helpProcess = Start-Process `
            -FilePath (Resolve-Path .\bindist\cataclysm-tiles.exe).Path `
            -ArgumentList '--help' `
            -RedirectStandardOutput $helpStdout `
            -RedirectStandardError $helpStderr `
            -Wait `
            -PassThru
          $helpText = @(
            if (Test-Path $helpStdout) { Get-Content $helpStdout }
            if (Test-Path $helpStderr) { Get-Content $helpStderr }
          ) -join [Environment]::NewLine
          if ($helpProcess.ExitCode -ne 0 -or
              $helpText -notmatch [regex]::Escape('--connect <host:port>') -or
              $helpText -notmatch [regex]::Escape('--connect-token-file <path>')) {
            throw "Windows multiplayer client CLI smoke failed: $helpText"
          }
          $helpText | Set-Content artifacts\windows-help.txt
          & 7z t artifacts\cdda-windows-client-x64-baseline.zip
          if ($LASTEXITCODE -ne 0) {
            throw "Windows package integrity check failed"
          }
          $hash = (Get-FileHash artifacts\cdda-windows-client-x64-baseline.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $msbuildVersion = (msbuild -version -nologo | Select-Object -Last 1).Trim()
          $cmakeVersion = (cmake --version | Select-Object -First 1).Trim()
          @(
            'artifact=cdda-windows-client-x64-baseline.zip'
            "sha256=$hash"
            'source_commit=${{ github.sha }}'
            'multiplayer_build_id=${{ github.sha }}'
            'upstream_baseline=${{ env.BASELINE_UPSTREAM_COMMIT }}'
            'runner_image=windows-2022'
            "msbuild=$msbuildVersion"
            "cmake=$cmakeVersion"
            'vcpkg_commit=${{ env.BASELINE_VCPKG_COMMIT }}'
            'tileset_commit=${{ env.BASELINE_TILESET_COMMIT }}'
            'soundpack_commit=${{ env.BASELINE_SOUNDPACK_COMMIT }}'
            'translations_sha256=${{ env.BASELINE_TRANSLATIONS_SHA256 }}'
            'build_command=msbuild Release x64 Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip'
          ) | Set-Content -Encoding ascii artifacts\windows-build-manifest.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-baseline-windows-client-x64-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android-client:
    name: Android arm64 release APK
    runs-on: ubuntu-24.04
    needs:
      - changes
      - default-tileset
      - shaders
      - translations
    if: ${{ needs.changes.outputs.android == 'true' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download default tileset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: multiplayer-baseline-default-tileset
          path: gfx/UltimateCataclysm

      - name: Download shader artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: multiplayer-baseline-shaders
          path: data/shaders

      - name: Download compiled translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: multiplayer-baseline-translations
          path: .

      - name: Mark shader artifacts fresh
        run: touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl

      - name: Setup JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          sdkmanager_path="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;34.0.0' \
            'ndk;28.1.13356709'

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew \
            -Pj="$(nproc)" \
            -Pabi_arm_32=false \
            -Pabi_arm_64=true \
            -Pabi_x86_32=false \
            -Pabi_x86_64=false \
            -Poverride_multiplayer_build_id="$GITHUB_SHA" \
            -Poverride_versionCode="${{ github.run_number }}" \
            assembleExperimentalRelease

      - name: Build x86_64 debug client compile gate
        working-directory: android
        run: |
          ./gradlew \
            -Pj="$(nproc)" \
            -Pabi_arm_32=false \
            -Pabi_arm_64=false \
            -Pabi_x86_32=false \
            -Pabi_x86_64=true \
            -Poverride_multiplayer_build_id="$GITHUB_SHA" \
            -Plocalize=false \
            assembleExperimentalDebug

      - name: Smoke test and record provenance
        run: |
          mkdir -p artifacts artifacts-x86
          package="$(find android/app/build/outputs/apk/experimental/release -type f -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$package"
          cp "$package" artifacts/cdda-android-arm64-baseline-unsigned.apk
          unzip -t artifacts/cdda-android-arm64-baseline-unsigned.apk
          unzip -l artifacts/cdda-android-arm64-baseline-unsigned.apk | grep -q 'lib/arm64-v8a/libmain.so'
          unzip -p artifacts/cdda-android-arm64-baseline-unsigned.apk \
            lib/arm64-v8a/libmain.so > "$RUNNER_TEMP/android-arm64-libmain.so"
          strings "$RUNNER_TEMP/android-arm64-libmain.so" | grep -Fx "$GITHUB_SHA"
          for unexpected_abi in armeabi-v7a x86 x86_64; do
            if unzip -l artifacts/cdda-android-arm64-baseline-unsigned.apk \
              | grep -q "lib/$unexpected_abi/"; then
              echo "Unexpected $unexpected_abi library in arm64-only APK" >&2
              exit 1
            fi
          done
          aapt_path="$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -x "$aapt_path"
          "$aapt_path" dump badging artifacts/cdda-android-arm64-baseline-unsigned.apk | tee artifacts/android-badging.txt
          "$aapt_path" dump permissions artifacts/cdda-android-arm64-baseline-unsigned.apk | tee artifacts/android-permissions.txt
          grep -q "android.permission.INTERNET" artifacts/android-permissions.txt
          "$aapt_path" dump resources artifacts/cdda-android-arm64-baseline-unsigned.apk \
            | tee artifacts/android-resources.txt
          grep -q 'string/launchModeTitle' artifacts/android-resources.txt
          grep -q 'string/multiplayerConnectTitle' artifacts/android-resources.txt
          grep -q 'string/multiplayerSecurityNotice' artifacts/android-resources.txt
          x86_package="$(find android/app/build/outputs/apk/experimental/debug -type f -name '*x86_64*.apk' -print -quit)"
          test -n "$x86_package"
          cp "$x86_package" artifacts-x86/cdda-android-x86_64-debug.apk
          unzip -t artifacts-x86/cdda-android-x86_64-debug.apk
          unzip -l artifacts-x86/cdda-android-x86_64-debug.apk \
            | grep -q 'lib/x86_64/libmain.so'
          unzip -p artifacts-x86/cdda-android-x86_64-debug.apk \
            lib/x86_64/libmain.so > "$RUNNER_TEMP/android-x86_64-libmain.so"
          strings "$RUNNER_TEMP/android-x86_64-libmain.so" | grep -Fx "$GITHUB_SHA"
          for unexpected_abi in armeabi-v7a arm64-v8a x86; do
            if unzip -l artifacts-x86/cdda-android-x86_64-debug.apk \
              | grep -q "lib/$unexpected_abi/"; then
              echo "Unexpected $unexpected_abi library in x86_64-only debug APK" >&2
              exit 1
            fi
          done
          {
            echo "artifact=cdda-android-x86_64-debug.apk"
            echo "sha256=$(sha256sum artifacts-x86/cdda-android-x86_64-debug.apk | cut -d' ' -f1)"
            echo "source_commit=$GITHUB_SHA"
            echo "multiplayer_build_id=$GITHUB_SHA"
            echo "runner_image=ubuntu-24.04"
            echo "android_platform=35"
            echo "android_ndk=28.1.13356709"
            echo "android_abi=x86_64"
            echo "build_command=./gradlew assembleExperimentalDebug x86_64-only"
          } > artifacts-x86/android-x86_64-build-manifest.txt
          {
            echo "artifact=cdda-android-arm64-baseline-unsigned.apk"
            echo "sha256=$(sha256sum artifacts/cdda-android-arm64-baseline-unsigned.apk | cut -d' ' -f1)"
            echo "source_commit=$GITHUB_SHA"
            echo "multiplayer_build_id=$GITHUB_SHA"
            echo "upstream_baseline=$BASELINE_UPSTREAM_COMMIT"
            echo "runner_image=ubuntu-24.04"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "gradle=$(cd android && ./gradlew --version | awk '/^Gradle / { print; exit }')"
            echo "android_platform=35"
            echo "android_build_tools=34.0.0"
            echo "android_ndk=28.1.13356709"
            echo "tileset_commit=$BASELINE_TILESET_COMMIT"
            echo "translations_sha256=$BASELINE_TRANSLATIONS_SHA256"
            echo "signed=false"
            echo "build_command=./gradlew assembleExperimentalRelease arm64-only"
          } > artifacts/android-build-manifest.txt

      - name: Upload Android arm64 package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-baseline-android-arm64-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Android x86_64 compile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-baseline-android-x86_64-${{ github.sha }}
          path: artifacts-x86
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
