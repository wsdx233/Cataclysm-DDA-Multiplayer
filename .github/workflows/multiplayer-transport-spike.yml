name: Multiplayer transport and protocol gates

on:
  workflow_dispatch:
  push:
    branches:
      - multiplayer/main
    paths:
      - '.github/workflows/multiplayer-transport-spike.yml'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'msvc-full-features/Cataclysm-common.props'
      - 'src/get_version.h'
      - 'src/multiplayer_*'
      - 'src/animation.cpp'
      - 'src/avatar.h'
      - 'src/avatar_action.cpp'
      - 'src/avatar_action.h'
      - 'src/character.h'
      - 'src/debug.cpp'
      - 'src/debug.h'
      - 'src/do_turn.cpp'
      - 'src/game.cpp'
      - 'src/game.h'
      - 'src/game_io.cpp'
      - 'src/handle_action.cpp'
      - 'src/loading_ui.cpp'
      - 'src/loading_ui.h'
      - 'src/main.cpp'
      - 'src/newcharacter.cpp'
      - 'src/output.cpp'
      - 'src/output.h'
      - 'src/version.cmake'
      - 'src/version.cpp'
      - 'src/third-party/multiplayer_protocol_generated.h'
      - 'src/third-party/asio.hpp'
      - 'src/third-party/asio/**'
      - 'tests/multiplayer_*'
      - 'tools/multiplayer/README.md'
      - 'tools/multiplayer/headless_client_smoke.cpp'
      - 'tools/multiplayer/network_client_ui_smoke.py'
      - 'tools/multiplayer/protocol/**'
      - 'tools/multiplayer/transport_spike/**'
  pull_request:
    branches:
      - multiplayer/main
    paths:
      - '.github/workflows/multiplayer-transport-spike.yml'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'msvc-full-features/Cataclysm-common.props'
      - 'src/get_version.h'
      - 'src/multiplayer_*'
      - 'src/animation.cpp'
      - 'src/avatar.h'
      - 'src/avatar_action.cpp'
      - 'src/avatar_action.h'
      - 'src/character.h'
      - 'src/debug.cpp'
      - 'src/debug.h'
      - 'src/do_turn.cpp'
      - 'src/game.cpp'
      - 'src/game.h'
      - 'src/game_io.cpp'
      - 'src/handle_action.cpp'
      - 'src/loading_ui.cpp'
      - 'src/loading_ui.h'
      - 'src/main.cpp'
      - 'src/newcharacter.cpp'
      - 'src/output.cpp'
      - 'src/output.h'
      - 'src/version.cmake'
      - 'src/version.cpp'
      - 'src/third-party/multiplayer_protocol_generated.h'
      - 'src/third-party/asio.hpp'
      - 'src/third-party/asio/**'
      - 'tests/multiplayer_*'
      - 'tools/multiplayer/README.md'
      - 'tools/multiplayer/headless_client_smoke.cpp'
      - 'tools/multiplayer/network_client_ui_smoke.py'
      - 'tools/multiplayer/protocol/**'
      - 'tools/multiplayer/transport_spike/**'

concurrency:
  group: multiplayer-transport-spike-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASIO_VERSION: 1.38.1
  ASIO_TAG: asio-1-38-1
  ASIO_COMMIT: dfd7b3e3145bac5d0e91a99fde69c6ae1442f971
  ASIO_SHA256: 2827b229972be80cdb14e5497962fa393d1adf036b5869e2b9c99f644daadacc
  FLATBUFFERS_VERSION: 1.12.0
  FLATBUFFERS_SHA256: 62f2223fb9181d1d6338451375628975775f7522185266cd5296571ac152bc45

jobs:
  linux:
    name: Linux GCC 13 and Clang 18 loopback
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install CMake 3
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375
        with:
          cmakeVersion: 3.31.6

      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 g++-13 gettext libbz2-dev libncurses-dev zlib1g-dev

      - name: Verify pinned FlatBuffers schema generation
        run: |
          mkdir -p build
          archive="build/flatbuffers-${FLATBUFFERS_VERSION}.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/google/flatbuffers/archive/refs/tags/v${FLATBUFFERS_VERSION}.tar.gz" \
            --output "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$FLATBUFFERS_SHA256"
          tar -xzf "$archive" -C build
          # FlatBuffers 1.12.0 forces -Werror and triggers a GCC 13 optimizer false positive
          # in reflection.cpp; demote only that third-party warning while retaining all others.
          cmake \
            -S "build/flatbuffers-${FLATBUFFERS_VERSION}" \
            -B build/flatbuffers-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS=-Wno-error=stringop-overflow \
            -DFLATBUFFERS_BUILD_TESTS=OFF
          cmake --build build/flatbuffers-host --config Release --parallel --target flatc
          FLATC="$PWD/build/flatbuffers-host/flatc" \
            tools/multiplayer/protocol/generate.sh --check

      - name: Build and run with GCC 13
        run: |
          cmake \
            -S tools/multiplayer/transport_spike \
            -B build/transport-spike-gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build/transport-spike-gcc --parallel
          ctest --test-dir build/transport-spike-gcc --output-on-failure
          mkdir -p artifacts
          build/transport-spike-gcc/multiplayer_transport_spike | tee artifacts/gcc-loopback.txt

      - name: Verify vendored Asio against the pinned archive
        run: |
          upstream=build/transport-spike-gcc/_deps/multiplayer_asio-src
          test "$(sha256sum "$upstream/LICENSE_1_0.txt" | cut -d' ' -f1)" = \
            c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566
          cmp "$upstream/include/asio.hpp" src/third-party/asio.hpp
          diff -qr \
            --exclude=LICENSE_1_0.txt \
            --exclude=VENDORED.md \
            "$upstream/include/asio" src/third-party/asio
          cmp "$upstream/LICENSE_1_0.txt" src/third-party/asio/LICENSE_1_0.txt

      - name: Build production multiplayer game tests with GCC 13
        run: |
          make -j2 \
            COMPILER=g++-13 \
            RELEASE=1 LOCALIZE=0 BACKTRACE=0 PCH=0 \
            cataclysm tests
          mkdir -p build/multiplayer-smoke
          g++-13 \
            -std=c++17 -O2 -Wall -Wextra -Werror \
            -Isrc -isystem src/third-party \
            tools/multiplayer/headless_client_smoke.cpp \
            src/multiplayer_protocol.cpp \
            src/multiplayer_transport.cpp \
            src/multiplayer_crypto.cpp \
            -pthread \
            -o build/multiplayer-smoke/headless_client_smoke

      - name: Run production multiplayer game tests
        run: |
          ./tests/cata_test '[multiplayer]' \
            --rng-seed 0 \
            --user-dir test_user_dir_multiplayer_ci \
            | tee artifacts/gcc-production-multiplayer-tests.txt

      - name: Run actual headless server command/resume smoke
        run: |
          set -euo pipefail
          root="$PWD/build/multiplayer-process-smoke"
          rm -rf "$root"
          mkdir -p "$root"
          ./cataclysm \
            --userdir "$root/user" \
            --init-server-config "$root/server.json" \
            >"$root/init.stdout" 2>"$root/init.stderr"
          test "$(stat -c '%a' "$root/server.json")" = 600
          test "$(stat -c '%a' "$root/server-auth-token.txt")" = 600
          port="$(python3 - "$root/server.json" <<'PY'
          import json
          import socket
          import sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as source:
              config = json.load(source)
          assert config["players"]["max"] == 1
          assert config["players"]["character_policy"] == "server_owned"
          assert config["save"]["keep_generations"] == 1
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]
          config["network"]["listen"] = f"127.0.0.1:{port}"
          with open(path, "w", encoding="utf-8") as output:
              json.dump(config, output, indent=2)
              output.write("\n")
          print(port)
          PY
          )"
          ./cataclysm \
            --userdir "$root/user" \
            --server "$root/server.json" \
            >"$root/server.stdout" 2>"$root/server.stderr" &
          server_pid=$!
          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid"
              wait "$server_pid" || true
            fi
          }
          trap cleanup EXIT
          for _ in $(seq 1 900); do
            if grep -q '"event":"listening"' "$root/server.stdout"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$root/server.stdout"
              cat "$root/server.stderr" >&2
              exit 1
            fi
            sleep 0.1
          done
          grep -q '"event":"listening"' "$root/server.stdout"
          build/multiplayer-smoke/headless_client_smoke \
            127.0.0.1 "$port" "$root/server-auth-token.txt" \
            | tee "$root/client.stdout"
          kill -TERM "$server_pid"
          wait "$server_pid"
          trap - EXIT
          python3 - "$root" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          for name in ("server.stdout", "server.stderr"):
              data = (root / name).read_bytes()
              assert b"\x1b[" not in data
              for line in data.splitlines():
                  if line.strip():
                      json.loads(line)
          output = (root / "server.stdout").read_text(encoding="utf-8")
          for event in (
              "player_authenticated", "resync_requested", "command_result",
              "player_resumed", "command_sequence_conflict", "save_completed", "shutdown"
          ):
              assert f'"event":"{event}"' in output, event
          assert '"status":"0"' in output
          assert '"status":"2"' in output
          PY
          cp "$root/client.stdout" artifacts/gcc-headless-client-smoke.txt
          cp "$root/server.stdout" artifacts/gcc-headless-server-smoke.jsonl
          cp "$root/server.stderr" artifacts/gcc-headless-server-smoke.stderr.jsonl

      - name: Run production local-input network-client UI resume smoke
        run: |
          set -euo pipefail
          root="$PWD/build/multiplayer-client-ui-smoke"
          rm -rf "$root"
          mkdir -p "$root"
          ./cataclysm \
            --userdir "$root/server-user" \
            --init-server-config "$root/server.json" \
            >"$root/init.stdout" 2>"$root/init.stderr"
          port="$(python3 - "$root/server.json" <<'PY'
          import json
          import socket
          import sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as source:
              config = json.load(source)
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]
          config["network"]["listen"] = f"127.0.0.1:{port}"
          with open(path, "w", encoding="utf-8") as output:
              json.dump(config, output, indent=2)
              output.write("\n")
          print(port)
          PY
          )"
          ./cataclysm \
            --userdir "$root/server-user" \
            --server "$root/server.json" \
            >"$root/server.stdout" 2>"$root/server.stderr" &
          server_pid=$!
          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid"
              wait "$server_pid" || true
            fi
          }
          trap cleanup EXIT
          for _ in $(seq 1 900); do
            if grep -q '"event":"listening"' "$root/server.stdout"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$root/server.stdout"
              cat "$root/server.stderr" >&2
              exit 1
            fi
            sleep 0.1
          done
          grep -q '"event":"listening"' "$root/server.stdout"
          python3 tools/multiplayer/network_client_ui_smoke.py \
            --client "$PWD/cataclysm" \
            --backend-port "$port" \
            --token-file "$root/server-auth-token.txt" \
            --user-dir "$root/client-user" \
            --transcript "$root/client.transcript" \
            --event-log "$root/client-events.txt"
          kill -TERM "$server_pid"
          wait "$server_pid"
          trap - EXIT
          python3 - "$root" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          for name in ("server.stdout", "server.stderr"):
              data = (root / name).read_bytes()
              assert b"\x1b[" not in data
              for line in data.splitlines():
                  if line.strip():
                      json.loads(line)
          records = [json.loads(line) for line in
                     (root / "server.stdout").read_text(encoding="utf-8").splitlines()
                     if line.strip()]
          events = [record["event"] for record in records]
          for event in (
              "player_authenticated", "player_resumed", "command_result",
              "save_completed", "shutdown"
          ):
              assert event in events, event
          statuses = [record.get("status") for record in records
                      if record["event"] == "command_result"]
          assert statuses == ["0", "2", "0"], statuses
          PY
          cp "$root/client-events.txt" artifacts/gcc-network-client-ui-events.txt
          cp "$root/client.transcript" artifacts/gcc-network-client-ui.transcript
          cp "$root/server.stdout" artifacts/gcc-network-client-ui-server.jsonl

      - name: Build and run with Clang 18
        run: |
          cmake \
            -S tools/multiplayer/transport_spike \
            -B build/transport-spike-clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build/transport-spike-clang --parallel
          ctest --test-dir build/transport-spike-clang --output-on-failure
          build/transport-spike-clang/multiplayer_transport_spike | tee artifacts/clang-loopback.txt

      - name: Record provenance
        run: |
          cp build/transport-spike-gcc/multiplayer_transport_spike artifacts/transport-spike-linux-gcc13
          cp build/transport-spike-clang/multiplayer_transport_spike artifacts/transport-spike-linux-clang18
          cp build/transport-spike-gcc/_deps/multiplayer_asio-src/LICENSE_1_0.txt artifacts/LICENSE-Asio.txt
          {
            echo "source_commit=$GITHUB_SHA"
            echo "runner_image=ubuntu-24.04"
            echo "asio_version=$ASIO_VERSION"
            echo "asio_tag=$ASIO_TAG"
            echo "asio_commit=$ASIO_COMMIT"
            echo "asio_archive_sha256=$ASIO_SHA256"
            echo "gcc=$(g++-13 --version | head -n 1)"
            echo "clang=$(clang++-18 --version | head -n 1)"
            echo "gcc_binary_sha256=$(sha256sum artifacts/transport-spike-linux-gcc13 | cut -d' ' -f1)"
            echo "clang_binary_sha256=$(sha256sum artifacts/transport-spike-linux-clang18 | cut -d' ' -f1)"
          } > artifacts/linux-transport-manifest.txt

      - name: Upload Linux evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-transport-linux-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 MSVC loopback
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Install CMake 3
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375
        with:
          cmakeVersion: 3.31.6

      - name: Build and run with MSVC
        shell: pwsh
        run: |
          cmake `
            -S tools/multiplayer/transport_spike `
            -B build/transport-spike-msvc `
            -G "Visual Studio 17 2022" `
            -A x64
          if ($LASTEXITCODE -ne 0) { throw 'MSVC transport configure failed' }
          cmake --build build/transport-spike-msvc --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'MSVC transport build failed' }
          ctest --test-dir build/transport-spike-msvc -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'MSVC transport loopback test failed' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & build/transport-spike-msvc/Release/multiplayer_transport_spike.exe |
            Tee-Object artifacts/msvc-loopback.txt
          if ($LASTEXITCODE -ne 0) { throw 'MSVC transport executable failed' }

      - name: Record provenance
        shell: pwsh
        run: |
          $binary = 'build/transport-spike-msvc/Release/multiplayer_transport_spike.exe'
          Copy-Item $binary artifacts/transport-spike-windows-msvc.exe
          Copy-Item build/transport-spike-msvc/_deps/multiplayer_asio-src/LICENSE_1_0.txt artifacts/LICENSE-Asio.txt
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $msbuildVersion = (msbuild -version -nologo | Select-Object -Last 1).Trim()
          @(
            'source_commit=${{ github.sha }}'
            'runner_image=windows-2022'
            'asio_version=${{ env.ASIO_VERSION }}'
            'asio_tag=${{ env.ASIO_TAG }}'
            'asio_commit=${{ env.ASIO_COMMIT }}'
            'asio_archive_sha256=${{ env.ASIO_SHA256 }}'
            "msbuild=$msbuildVersion"
            "binary_sha256=$hash"
          ) | Set-Content -Encoding ascii artifacts/windows-transport-manifest.txt

      - name: Upload Windows evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-transport-windows-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android NDK arm64 compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Android NDK toolchain
        run: |
          sdkmanager_path="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" \
            'platforms;android-35' \
            'cmake;3.22.1' \
            'ndk;28.1.13356709'

      - name: Cross-compile arm64 spike
        run: |
          cmake_path="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          ninja_path="$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          ndk_path="$ANDROID_HOME/ndk/28.1.13356709"
          "$cmake_path" \
            -S tools/multiplayer/transport_spike \
            -B build/transport-spike-android-arm64 \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$ninja_path" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ndk_path/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DANDROID_STL=c++_static
          "$cmake_path" --build build/transport-spike-android-arm64 --parallel

      - name: Inspect and record provenance
        run: |
          mkdir -p artifacts
          binary=build/transport-spike-android-arm64/multiplayer_transport_spike
          ndk_path="$ANDROID_HOME/ndk/28.1.13356709"
          file "$binary" | tee artifacts/android-file.txt
          grep -q 'ARM aarch64' artifacts/android-file.txt
          "$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$binary" \
            | tee artifacts/android-elf-header.txt
          grep -q 'Machine:.*AArch64' artifacts/android-elf-header.txt
          cp "$binary" artifacts/transport-spike-android-arm64
          cp build/transport-spike-android-arm64/_deps/multiplayer_asio-src/LICENSE_1_0.txt artifacts/LICENSE-Asio.txt
          {
            echo "source_commit=$GITHUB_SHA"
            echo "runner_image=ubuntu-24.04"
            echo "asio_version=$ASIO_VERSION"
            echo "asio_tag=$ASIO_TAG"
            echo "asio_commit=$ASIO_COMMIT"
            echo "asio_archive_sha256=$ASIO_SHA256"
            echo "android_platform=35"
            echo "android_ndk=28.1.13356709"
            echo "android_abi=arm64-v8a"
            echo "binary_sha256=$(sha256sum "$binary" | cut -d' ' -f1)"
          } > artifacts/android-transport-manifest.txt

      - name: Upload Android evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-transport-android-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
